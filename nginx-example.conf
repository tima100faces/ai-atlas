# AI Atlas — Nginx config
# Domain: idealabs.co/learn

server {
    listen 80;
    server_name idealabs.co;

    # Main site redirect (if needed)
    location / {
        return 301 https://idealabs.co/learn;
    }
}

server {
    listen 443 ssl;
    server_name idealabs.co;

    ssl_certificate     /etc/letsencrypt/live/idealabs.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/idealabs.co/privkey.pem;

    # AI Atlas
    location /learn {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API
    location /learn/api {
        rewrite ^/learn/api/(.*) /api/$1 break;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
