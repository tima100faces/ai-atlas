version: '3.8'

services:
  backend:
    build:
      context: ./app/backend
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    volumes:
      - ./content:/app/content:ro
      - ./progress:/app/progress
    environment:
      - AI_ATLAS_PASSWORD=timohin2026
      - CONTENT_DIR=/app/content
      - PROGRESS_DIR=/app/progress
    restart: unless-stopped

  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://backend:8000
    restart: unless-stopped
